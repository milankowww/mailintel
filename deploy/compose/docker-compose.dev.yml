services:
  app:
    image: python:3.12-slim
    working_dir: /workspace
    environment:
      MAILINTEL_PROFILE: docker-dev
      MAILINTEL_DATABASE_URL: postgresql://mailintel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/mailintel
      MAILINTEL_HOST: 0.0.0.0
      MAILINTEL_PORT: 8000
      MAILINTEL_CONFIG_DIR: /workspace/docker-data/secrets
      MAILINTEL_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      MAILINTEL_LLM_TIMEOUT_SECONDS: ${MAILINTEL_LLM_TIMEOUT_SECONDS:-1800}
      MAILINTEL_CLUSTER_WORKER_COUNT: ${MAILINTEL_CLUSTER_WORKER_COUNT:-4}
      MAILINTEL_SMART_SEARCH_OWNER_TIMEZONE: ${MAILINTEL_SMART_SEARCH_OWNER_TIMEZONE:-UTC}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # For Ollama running on the host, use http://host.docker.internal:11434 in the UI.
    command: >
      sh -c "pip install --no-cache-dir -e 'backend[dev]'
      && mailintel init-db
      && mailintel serve --reload --host 0.0.0.0 --port 8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${MAILINTEL_PORT:-8000}:8000"
    volumes:
      - .:/workspace
      - ./docker-data/pip-cache:/root/.cache/pip
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mailintel
      POSTGRES_USER: mailintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailintel -d mailintel"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${MAILINTEL_DB_PORT:-5432}:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
